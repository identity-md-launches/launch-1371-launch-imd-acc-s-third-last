<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>imd/acc</title>
  <meta name="description" content="Trading cashback in staked IMD. Sepolia test run 2.">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <script>
    (() => {
      let saved;
      try {
        saved = localStorage.getItem("imd-acc-theme");
      } catch {}
      const theme =
        saved === "light" || saved === "dark"
          ? saved
          : matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="site-header">
    <div class="container topbar-inner">
      <a href="#/" class="brand">imd<span>/</span>acc</a>
      <nav class="desktop-nav" aria-label="Main Navigation">
        <a href="#/">Home</a>
        <a href="#/stack">Stack</a>
        <a href="#/projects">Projects</a>
        <a href="#/apply">Apply</a>
        <a href="#/leaderboard">Leaderboard</a>
        <a href="#/docs/what">Docs</a>
      </nav>
      <div class="header-controls">
        <button class="btn btn-small refresh-button" id="refresh-btn">Refresh</button>
        <button class="theme-button" id="theme-btn" aria-label="Toggle theme">◐</button>
        <button class="btn btn-small connect-button" id="connect-btn">Connect</button>
        <button class="menu-button" id="menu-btn" aria-expanded="false" aria-controls="mobile-navigation" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <nav id="mobile-navigation" aria-label="Mobile Navigation">
    <ul>
      <li><a href="#/">Home</a></li>
      <li><a href="#/stack">Stack</a></li>
      <li><a href="#/projects">Projects</a></li>
      <li><a href="#/apply">Apply</a></li>
      <li><a href="#/leaderboard">Leaderboard</a></li>
      <li><a href="#/docs/what">Docs</a></li>
    </ul>
  </nav>

  <main id="app-root" class="container">
    <!-- Rendered by app.js based on hash route -->
  </main>

  <footer>
    <div class="container footer-inner">
      <span>imd/acc · Sepolia test run 2</span>
      <span><a href="#/docs/addresses">Docs > Addresses</a></span>
    </div>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
